<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkTok - Shorts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Full screen scroll snap for Shorts */
    .shorts-container {
      scroll-snap-type: y mandatory;
      overflow-y: scroll;
      height: calc(100vh - 57px);
    }
    .short-card {
      scroll-snap-align: start;
      height: calc(100vh - 57px);
    }
  </style>
</head>
<body class="bg-black text-white font-sans antialiased overflow-hidden pb-16 md:pb-0">

  <!-- TOP NAVBAR -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-4 py-2.5 flex items-center justify-between">
    <div class="flex items-center space-x-2.5">
      <img src="logo.png" alt="Logo" class="w-8 h-8 rounded-xl object-contain" onerror="this.src='https://via.placeholder.com/36/2563eb/ffffff?text=WT'">
      <span class="text-xl font-black text-blue-500 tracking-tight">WorkTok <span class="text-xs font-normal text-slate-400">Shorts</span></span>
    </div>
    <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700">
      <i class="fa-solid fa-arrow-left mr-1"></i> Back to Home
    </a>
  </header>

  <!-- SHORTS FEED (Full Screen Vertical Scroll) -->
  <div class="shorts-container max-w-md mx-auto relative bg-slate-950">

    <!-- SHORT 1 -->
    <div class="short-card relative w-full flex items-center justify-center bg-slate-900 border-b border-slate-800">
      <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=600&auto=format&fit=crop" class="w-full h-full object-cover opacity-80" alt="Short Video">
      
      <!-- Overlay Info -->
      <div class="absolute bottom-6 left-4 right-16 space-y-2 z-10 text-left">
        <div class="flex items-center space-x-2">
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=CodeWithMe" class="w-9 h-9 rounded-full border-2 border-blue-500">
          <span class="font-bold text-sm">@CodeWithMe</span>
          <button class="bg-blue-600 text-white text-[10px] font-bold px-2.5 py-1 rounded-full">Follow</button>
        </div>
        <p class="text-xs text-slate-200 line-clamp-2">3 Secret Web Dev Tricks in 30 Seconds! 🚀 #coding #webdev #worktok</p>
      </div>

      <!-- Action Buttons Right Side -->
      <div class="absolute bottom-8 right-3 flex flex-col space-y-5 items-center z-10">
        <button class="flex flex-col items-center hover:scale-110 transition">
          <div class="w-10 h-10 rounded-full bg-slate-800/80 backdrop-blur flex items-center justify-center text-rose-500">
            <i class="fa-solid fa-heart text-lg"></i>
          </div>
          <span class="text-[10px] mt-1 font-semibold">12.5K</span>
        </button>

        <button class="flex flex-col items-center hover:scale-110 transition">
          <div class="w-10 h-10 rounded-full bg-slate-800/80 backdrop-blur flex items-center justify-center text-white">
            <i class="fa-solid fa-comment text-lg"></i>
          </div>
          <span class="text-[10px] mt-1 font-semibold">342</span>
        </button>

        <button class="flex flex-col items-center hover:scale-110 transition">
          <div class="w-10 h-10 rounded-full bg-slate-800/80 backdrop-blur flex items-center justify-center text-white">
            <i class="fa-solid fa-share text-lg"></i>
          </div>
          <span class="text-[10px] mt-1 font-semibold">Share</span>
        </button>
      </div>
    </div>

    <!-- SHORT 2 -->
    <div class="short-card relative w-full flex items-center justify-center bg-slate-900 border-b border-slate-800">
      <img src="https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=600&auto=format&fit=crop" class="w-full h-full object-cover opacity-80" alt="Short Video">
      
      <div class="absolute bottom-6 left-4 right-16 space-y-2 z-10 text-left">
        <div class="flex items-center space-x-2">
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=DesignPro" class="w-9 h-9 rounded-full border-2 border-blue-500">
          <span class="font-bold text-sm">@DesignPro</span>
          <button class="bg-blue-600 text-white text-[10px] font-bold px-2.5 py-1 rounded-full">Follow</button>
        </div>
        <p class="text-xs text-slate-200 line-clamp-2">How to pick perfect color palettes for mobile apps! 🎨 #uiux #design</p>
      </div>

      <div class="absolute bottom-8 right-3 flex flex-col space-y-5 items-center z-10">
        <button class="flex flex-col items-center hover:scale-110 transition">
          <div class="w-10 h-10 rounded-full bg-slate-800/80 backdrop-blur flex items-center justify-center text-rose-500">
            <i class="fa-solid fa-heart text-lg"></i>
          </div>
          <span class="text-[10px] mt-1 font-semibold">8.9K</span>
        </button>

        <button class="flex flex-col items-center hover:scale-110 transition">
          <div class="w-10 h-10 rounded-full bg-slate-800/80 backdrop-blur flex items-center justify-center text-white">
            <i class="fa-solid fa-comment text-lg"></i>
          </div>
          <span class="text-[10px] mt-1 font-semibold">180</span>
        </button>

        <button class="flex flex-col items-center hover:scale-110 transition">
          <div class="w-10 h-10 rounded-full bg-slate-800/80 backdrop-blur flex items-center justify-center text-white">
            <i class="fa-solid fa-share text-lg"></i>
          </div>
          <span class="text-[10px] mt-1 font-semibold">Share</span>
        </button>
      </div>
    </div>

  </div>

  <!-- MOBILE BOTTOM NAVIGATION -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-950 border-t border-slate-800 py-2 px-4 flex justify-between items-center z-50 text-slate-400 text-[10px]">
    <a href="index.html" class="flex flex-col items-center hover:text-white">
      <i class="fa-solid fa-house text-base"></i>
      <span>Home</span>
    </a>
    <a href="shorts.html" class="flex flex-col items-center text-blue-500 font-bold">
      <i class="fa-solid fa-bolt text-base"></i>
      <span>Shorts</span>
    </a>
    <a href="#" class="flex flex-col items-center hover:text-white">
      <i class="fa-solid fa-comments text-base"></i>
      <span>Messages</span>
    </a>
    <a href="#" class="flex flex-col items-center hover:text-white">
      <i class="fa-solid fa-briefcase text-base"></i>
      <span>Gigs</span>
    </a>
  </nav>

</body>
  </html>
