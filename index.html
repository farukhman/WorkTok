<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkTok - Learn . Connect . Earn</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased pb-16 md:pb-0">

  <!-- TOP NAVBAR -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 px-4 md:px-6 py-2.5 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-2.5">
      <img src="logo.png" alt="WorkTok Logo" class="w-9 h-9 rounded-xl object-contain shadow-sm" onerror="this.src='https://via.placeholder.com/36/2563eb/ffffff?text=WT'">
      <span class="text-xl md:text-2xl font-black text-blue-600 tracking-tight">WorkTok</span>
    </div>

    <!-- Search Bar -->
    <div class="flex-1 max-w-md mx-4 hidden sm:block relative">
      <i class="fa-solid fa-magnifying-glass absolute left-4 top-3 text-slate-400 text-xs"></i>
      <input type="text" placeholder="Search skills, tutorials, gigs..." class="w-full bg-slate-100/90 text-xs rounded-full py-2 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Right Actions -->
    <div class="flex items-center space-x-3">
      <button onclick="refreshFeed()" class="p-2 text-slate-600 hover:text-blue-600 transition" title="Refresh Feed">
        <i class="fa-solid fa-rotate-right text-base"></i>
      </button>
      <button class="p-2 text-slate-500 hover:text-slate-700 relative">
        <i class="fa-solid fa-bell text-base"></i>
        <span class="absolute top-1 right-1 bg-red-500 text-white text-[9px] w-3.5 h-3.5 rounded-full flex items-center justify-center font-bold">2</span>
      </button>
      <button class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-3.5 py-1.5 rounded-lg text-xs flex items-center shadow-sm">
        <i class="fa-solid fa-plus mr-1 text-[10px]"></i> Create
      </button>
      <div class="w-8 h-8 rounded-full bg-slate-200 border overflow-hidden">
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Farukh" alt="User" class="w-full h-full object-cover">
      </div>
    </div>
  </header>

  <div class="flex min-h-[calc(100vh-57px)]">

    <!-- SIDEBAR (Desktop) -->
    <aside class="hidden md:block w-60 bg-[#0F172A] text-slate-300 p-4 space-y-1 flex-shrink-0">
      <a href="#" class="flex items-center space-x-3 bg-blue-600 text-white px-3.5 py-2.5 rounded-xl font-medium text-xs shadow-sm">
        <i class="fa-solid fa-house w-4"></i> <span>Home</span>
      </a>
      <a href="shorts.html" class="flex items-center space-x-3 hover:bg-slate-800/60 px-3.5 py-2 rounded-xl text-xs font-medium text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-bolt w-4"></i> <span>Shorts</span>
      </a>
      <a href="#" class="flex items-center space-x-3 hover:bg-slate-800/60 px-3.5 py-2 rounded-xl text-xs font-medium text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-comments w-4"></i> <span>Messages</span>
      </a>
      <a href="#" class="flex items-center space-x-3 hover:bg-slate-800/60 px-3.5 py-2 rounded-xl text-xs font-medium text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-briefcase w-4"></i> <span>Gigs</span>
      </a>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 p-3 md:p-6 space-y-4 max-w-full md:max-w-[850px]">

      <!-- Hero Banner -->
      <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-blue-900 text-white rounded-2xl p-5 md:p-7 relative overflow-hidden shadow-sm">
        <div class="max-w-md space-y-2 relative z-10">
          <h1 class="text-xl md:text-2xl font-bold tracking-tight">Learn . Connect . Earn</h1>
          <p class="text-slate-300 text-xs">Your Skills. Your Growth. Your Future.</p>
          <button class="mt-1 bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg text-xs font-semibold shadow">
            Explore Now &rarr;
          </button>
        </div>
      </div>

      <!-- Category Filter Pills -->
      <div class="flex items-center space-x-2 text-xs font-semibold overflow-x-auto pb-1 no-scrollbar">
        <button class="bg-blue-600 text-white px-4 py-1.5 rounded-full whitespace-nowrap shadow-sm">Home</button>
        <button class="bg-white text-slate-600 hover:bg-slate-100 border px-4 py-1.5 rounded-full whitespace-nowrap">Shorts</button>
        <button class="bg-white text-slate-600 hover:bg-slate-100 border px-4 py-1.5 rounded-full whitespace-nowrap">Posts</button>
        <button class="bg-white text-slate-600 hover:bg-slate-100 border px-4 py-1.5 rounded-full whitespace-nowrap">Gigs</button>
        <button class="bg-white text-slate-600 hover:bg-slate-100 border px-4 py-1.5 rounded-full whitespace-nowrap">Coding</button>
        <button class="bg-white text-slate-600 hover:bg-slate-100 border px-4 py-1.5 rounded-full whitespace-nowrap">Design</button>
      </div>

      <!-- VIDEO FEED SECTION -->
      <section class="space-y-4">
        <div class="flex justify-between items-center mb-1">
          <h2 class="text-xs md:text-sm font-bold text-slate-900">Recommended For You</h2>
          <button onclick="refreshFeed()" class="text-[11px] text-blue-600 font-semibold flex items-center gap-1 hover:underline">
            <i class="fa-solid fa-arrows-rotate text-[10px]"></i> Refresh
          </button>
        </div>

        <!-- Video Cards Container -->
        <div id="video-feed" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Direct JS insertion -->
        </div>
      </section>

    </main>
  </div>

  <!-- MOBILE BOTTOM NAV -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 px-4 flex justify-between items-center z-50 text-slate-600 text-[10px]">
    <a href="#" class="flex flex-col items-center text-blue-600 font-bold">
      <i class="fa-solid fa-house text-base"></i>
      <span>Home</span>
    </a>
    <a href="shorts.html" class="flex flex-col items-center hover:text-blue-600">
      <i class="fa-solid fa-bolt text-base"></i>
      <span>Shorts</span>
    </a>
    <a href="#" class="flex flex-col items-center hover:text-blue-600">
      <i class="fa-solid fa-comments text-base"></i>
      <span>Connect</span>
    </a>
    <a href="#" class="flex flex-col items-center hover:text-blue-600">
      <i class="fa-solid fa-briefcase text-base"></i>
      <span>Gigs</span>
    </a>
  </nav>

  <!-- INSTANT FEED GENERATOR SCRIPT -->
  <script>
    const videos = [
      {
        title: "How to Start Freelancing in 2026 (Step by Step Guide)",
        channel: "SkillHub",
        seed: "SkillHub",
        thumb: "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=500&auto=format&fit=crop",
        views: "120K", days: "2 days ago", time: "12:45"
      },
      {
        title: "10 Best Websites to Make Money Online Easily",
        channel: "Tech World",
        seed: "TechWorld",
        thumb: "https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=500&auto=format&fit=crop",
        views: "85K", days: "5 days ago", time: "08:15"
      },
      {
        title: "Complete Web Development Roadmap 2026",
        channel: "CodeWithMe",
        seed: "CodeWithMe",
        thumb: "https://images.unsplash.com/photo-1522542550221-31fd19575a2d?w=500&auto=format&fit=crop",
        views: "210K", days: "1 week ago", time: "18:30"
      },
      {
        title: "UI/UX Design Course for Beginners - Build Mobile Apps",
        channel: "DesignPro",
        seed: "DesignPro",
        thumb: "https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=500&auto=format&fit=crop",
        views: "45K", days: "3 days ago", time: "14:20"
      },
      {
        title: "Learn Python Programming in 30 Minutes",
        channel: "CodeWithMe",
        seed: "CodeWithMe",
        thumb: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=500&auto=format&fit=crop",
        views: "310K", days: "2 weeks ago", time: "25:10"
      },
      {
        title: "How I Earned $5000/Month on Upwork & Fiverr",
        channel: "Freelance Mastery",
        seed: "FreelanceMastery",
        thumb: "https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?w=500&auto=format&fit=crop",
        views: "95K", days: "4 days ago", time: "11:05"
      }
    ];

    function renderFeed() {
      const container = document.getElementById('video-feed');
      container.innerHTML = '';

      videos.forEach(v => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition duration-200";
        card.innerHTML = `
          <div class="relative bg-slate-900 group cursor-pointer">
            <img src="${v.thumb}" class="w-full h-44 object-cover group-hover:opacity-90 transition" alt="Thumbnail">
            <span class="absolute bottom-2 right-2 bg-black/80 text-white text-[10px] font-semibold px-1.5 py-0.5 rounded">${v.time}</span>
          </div>
          <div class="p-3 flex items-start space-x-3">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${v.seed}" class="w-9 h-9 rounded-full bg-slate-100 flex-shrink-0 border" alt="${v.channel}">
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-start">
                <h3 class="font-bold text-xs text-slate-900 line-clamp-2 leading-snug hover:text-blue-600 cursor-pointer">${v.title}</h3>
                <button class="text-slate-400 hover:text-slate-600 p-1 -mr-1"><i class="fa-solid fa-ellipsis-vertical text-xs"></i></button>
              </div>
              <p class="text-[11px] text-slate-500 font-medium mt-1 flex items-center space-x-1">
                <span>${v.channel}</span>
                <i class="fa-solid fa-circle-check text-[9px] text-blue-500"></i>
              </p>
              <p class="text-[10px] text-slate-400 mt-0.5">${v.views} views • ${v.days}</p>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function refreshFeed() {
      videos.sort(() => Math.random() - 0.5);
      renderFeed();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Run instantly on page load
    document.addEventListener('DOMContentLoaded', renderFeed);
    renderFeed();
  </script>
</body>
  </html>
