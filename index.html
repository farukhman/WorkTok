<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkTok</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 text-slate-800">

  <!-- Header Section -->
  <header class="bg-white border-b sticky top-0 z-50 px-6 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-xl w-10 h-10 flex items-center justify-center">W</div>
      <span class="text-2xl font-black text-blue-600">WorkTok</span>
    </div>
    <div class="w-1/3 relative">
      <input type="text" placeholder="Search WorkTok..." class="w-full bg-slate-100 rounded-full py-2 pl-4 pr-4 text-sm focus:outline-none">
    </div>
    <button class="bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold text-sm hover:bg-blue-700">+ Create</button>
  </header>

  <!-- Separate JS Files Load Honge -->
  <script src="js/app.js"></script>
  <script src="js/long-videos.js"></script>
  <script src="js/shorts.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/gigs.js"></script>
</body>
  </html>
